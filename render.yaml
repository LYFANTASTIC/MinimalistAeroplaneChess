services:
  - type: web
    name: minimalist-aeroplane-chess
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:frontend && npm --workspace backend run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
